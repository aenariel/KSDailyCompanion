name: Build APK

on:
  push:
    branches: [main, dev]
  # Releases are published on GitHub (which creates the tag): one build per release
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the test-build version name

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          # Releases: v0.2.0 -> 0.2.0 (a stray dot, v.0.2.0, is dropped too).
          # Test builds: the next patch after the latest release tag, e.g. 0.2.1-dev.15, so Obtainium never takes them for a release.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; V="${V#.}"
          else
            LAST=$(git tag --list 'v*' --sort=-v:refname | head -1); LAST="${LAST#v}"; LAST="${LAST#.}"; LAST="${LAST:-0.1.0}"
            IFS=. read -r MA MI PA <<< "$LAST"; PA="${PA:-0}"; V="${MA}.${MI}.$(( ${PA%%[^0-9]*} + 1 ))-dev.${GITHUB_RUN_NUMBER}"
            echo "Latest release tag: v$LAST"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Version $V (code ${GITHUB_RUN_NUMBER}) from $GITHUB_REF"

      - name: Signing key
        env:
          KS_KEYSTORE_BASE64: ${{ secrets.KS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_KEYSTORE_BASE64" ]; then
            echo "$KS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KS_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release key decoded ($(stat -c %s "$RUNNER_TEMP/release.p12") bytes)"
          else
            echo "::warning::Secret KS_KEYSTORE_BASE64 is missing: this APK is signed with a throwaway debug key and cannot update a release install."
          fi

      - name: Unit tests and layout snapshots
        # recordPaparazziDebug runs every debug unit test and writes the layout images (normal, 1.3x and 2x text)
        run: ./gradlew --no-daemon --console=plain recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-snapshots
          path: app/src/test/snapshots/images/
          if-no-files-found: warn
          retention-days: 14

      - name: Build release APK
        env:
          KS_STORE_PASSWORD: ${{ secrets.KS_STORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KS_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/KSCompanion-${VERSION_NAME}.apk"
          ls -la out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs out/*.apk | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: KSCompanion-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 30

      - name: Test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists: attaching the APK"
            gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber
          else
            echo "Creating release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" out/*.apk --title "KSCompanion $VERSION_NAME" --generate-notes
          fi
